<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    
    <title>Мой календарь заметок</title>
    <meta name="description" content="Управляйте своими заметками">
    
    <meta property="og:title" content="Мой календарь заметок">
    <meta property="og:description" content="Личный календарь для ваших заметок">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📅%3C/text%3E%3C/svg%3E">
    
    <link rel="stylesheet" type="text/css" href="style.css">
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; margin: 0; }
        .app-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .app-header { background: white; border-radius: 16px; padding: 16px 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo-small { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-size: 28px; }
        .user-info { display: flex; align-items: center; gap: 16px; }
        .btn-logout { padding: 8px 16px; background: #f44336; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .calendar-mode { display: flex; gap: 16px; margin-bottom: 24px; justify-content: center; }
        .mode-btn { padding: 12px 32px; background: white; border: none; border-radius: 40px; font-size: 15px; cursor: pointer; }
        .mode-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .main-content { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
        .calendar-container { background: white; border-radius: 20px; padding: 24px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .nav-btn { padding: 8px 16px; background: #f8f9fa; border: none; border-radius: 8px; cursor: pointer; }
        .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 12px; padding: 12px 0; background: #f8f9fa; border-radius: 12px; }
        .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #f8f9fa; border-radius: 12px; cursor: pointer; position: relative; }
        .calendar-day.selected { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .calendar-day.has-note::after { content: "📝"; position: absolute; top: 4px; right: 4px; font-size: 10px; }
        .calendar-day.other-month { opacity: 0.3; }
        .notes-panel { background: white; border-radius: 20px; padding: 24px; }
        .notes-list { max-height: 400px; overflow-y: auto; margin-bottom: 20px; }
        .note-item { background: #f8f9fa; padding: 14px; border-radius: 12px; margin-bottom: 12px; border-left: 4px solid #667eea; position: relative; }
        .delete-note { position: absolute; top: 10px; right: 10px; background: #f44336; color: white; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
        .add-note-form input, .add-note-form textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #e0e0e0; border-radius: 10px; }
        .btn-save { width: 100%; padding: 10px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; cursor: pointer; }
        .notification { position: fixed; bottom: 20px; right: 20px; padding: 14px 24px; border-radius: 12px; color: white; z-index: 1000; }
        .notification-success { background: #4caf50; }
        .notification-error { background: #f44336; }
        .notification-info { background: #2196f3; }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .loader { width: 50px; height: 50px; border: 4px solid white; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 900px) { .main-content { grid-template-columns: 1fr; } .app-header { flex-direction: column; gap: 12px; } }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-small">
                <span class="logo-icon">📅</span>
                <h1>Календарь заметок</h1>
            </div>
            <div class="user-info">
                <span id="userEmail" class="user-email"></span>
                <button id="logoutBtn" class="btn-logout">🚪 Выйти</button>
            </div>
        </header>

        <div class="calendar-mode">
            <button id="personalModeBtn" class="mode-btn active">👤 Личный календарь</button>
            <button id="sharedModeBtn" class="mode-btn">🌍 Общий календарь</button>
        </div>

        <div class="main-content">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prevMonthBtn" class="nav-btn">◀</button>
                    <h2 id="currentMonthYear"></h2>
                    <button id="nextMonthBtn" class="nav-btn">▶</button>
                </div>
                <div class="calendar-weekdays">
                    <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
                </div>
                <div id="calendarDays" class="calendar-days"></div>
            </div>

            <div class="notes-panel">
                <h3 id="selectedDateTitle">📝 Заметки</h3>
                <div id="notesList" class="notes-list">
                    <div>Выберите дату в календаре</div>
                </div>
                <div class="add-note-form">
                    <input type="text" id="noteTitle" placeholder="Заголовок заметки" maxlength="100">
                    <textarea id="noteContent" placeholder="Текст заметки..." rows="3" maxlength="1000"></textarea>
                    <button id="saveNoteBtn" class="btn-save">💾 Сохранить заметку</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader"></div>
        <p>Загрузка...</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script src="config.js"></script>
    <script src="firebase-config.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
